services:
  mywallet:
    build: .
    init: true
    ports:
      - "127.0.0.1:3080:3080"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3080
      DATA_DIR: /app/data
      DEMO_MODE: "false"
    volumes:
      - wallet-data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s

volumes:
  wallet-data:
