<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f9f8" />
    <title>MyWallet | Mon patrimoine crypto</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
    <script defer src="/vendor/chart.js"></script>
    <script defer src="/vendor/lucide.js"></script>
    <script defer src="/app.js"></script>
  </head>
  <body>
    <div id="boot" class="boot">
      <span class="brand-mark"><i data-lucide="wallet"></i></span
      ><span>MyWallet</span>
    </div>
    <section id="login-screen" class="login-screen" hidden>
      <div class="login-brand">
        <span class="brand-mark"><i data-lucide="wallet"></i></span
        >MyWallet<span class="brand-dot">.</span>
      </div>
      <form id="login-form" class="login-form">
        <span class="eyebrow">ESPACE PERSONNEL</span>
        <h1>Bon retour.</h1>
        <label for="login-password">Mot de passe</label>
        <input
          id="login-password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          autofocus
        />
        <p id="login-error" class="form-error" role="alert"></p>
        <button class="button primary" type="submit">
          Se connecter <i data-lucide="arrow-right"></i>
        </button>
      </form>
      <span class="login-foot"
        ><i data-lucide="shield-check"></i> Votre espace, vos
        donn&eacute;es.</span
      >
    </section>

    <div id="app" class="app-shell" hidden>
      <aside class="sidebar">
        <a class="brand" href="#overview" aria-label="MyWallet, accueil"
          ><span class="brand-mark"><i data-lucide="wallet"></i></span
          ><span>MyWallet<span class="brand-dot">.</span></span></a
        >
        <div class="workspace">
          <span class="avatar">M</span>
          <div>
            <strong>Mon espace</strong><span>Portefeuille personnel</span>
          </div>
          <i data-lucide="lock-keyhole"></i>
        </div>
        <div class="nav-caption">PATRIMOINE</div>
        <nav class="nav" aria-label="Navigation principale">
          <a href="#overview" data-view="overview"
            ><i data-lucide="layout-dashboard"></i><span>Vue d'ensemble</span
            ><span class="nav-indicator"></span
          ></a>
          <a href="#accounts" data-view="accounts"
            ><i data-lucide="wallet-cards"></i><span>Mes comptes</span
            ><span id="account-count" class="nav-count">0</span></a
          >
          <a href="#history" data-view="history"
            ><i data-lucide="chart-no-axes-combined"></i
            ><span>Historique</span></a
          >
        </nav>
        <div class="sidebar-bottom">
          <a class="settings-link" href="#settings" data-view="settings"
            ><i data-lucide="settings-2"></i><span>Param&egrave;tres</span></a
          >
          <div class="local-status">
            <span class="status-dot"></span><span>Stockage local</span
            ><i data-lucide="database"></i>
          </div>
          <div class="sidebar-footer">MYWALLET <span>v0.2</span></div>
        </div>
      </aside>
